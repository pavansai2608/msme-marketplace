# Full nginx configuration, not a conf.d fragment: the stock one writes its pid
# and temp files to root-owned paths, which a non-root worker cannot do.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    # Every scratch path moved under /tmp so the image can run read-only-ish
    # as an unprivileged user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Rendered from templates/default.conf.template at startup, which is how
    # BACKEND_URL gets substituted.
    include /etc/nginx/conf.d/*.conf;
}
