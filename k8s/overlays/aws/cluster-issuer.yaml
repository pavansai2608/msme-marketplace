# Let's Encrypt issuers for cert-manager.
#
# ClusterIssuer is cluster-scoped, so the overlay's `namespace: msme` does not
# apply to it. The private key each one registers with the ACME server is
# stored in a Secret in cert-manager's own namespace, created automatically.
#
# ACME-EMAIL-PLACEHOLDER is substituted by scripts/aws-bootstrap.sh from
# ACME_EMAIL in /opt/msme/.env, so no personal address is committed.
#
# BOTH issuers are defined, and that is deliberate. Let's Encrypt's production
# endpoint has hard rate limits; its staging endpoint has generous ones but
# issues certificates browsers do not trust. Validate the whole HTTP-01 path
# against staging first, then switch the ingress annotation to letsencrypt-prod
# - see aws/README.md. Getting this wrong on production is how people end up
# locked out for a week.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app.kubernetes.io/part-of: msme-marketplace
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: ACME-EMAIL-PLACEHOLDER
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            # Must name the controller that is actually running, or the
            # challenge Ingress is created and never served.
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app.kubernetes.io/part-of: msme-marketplace
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ACME-EMAIL-PLACEHOLDER
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
