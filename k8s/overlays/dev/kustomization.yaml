apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: msme

resources:
  - ../../base

# Local images built straight into the minikube docker daemon, so there is no
# registry and nothing to pull.
images:
  - name: msme-backend
    newTag: dev
  - name: msme-frontend
    newTag: dev
  - name: msme-recommender
    newTag: dev

patches:
  # One replica each is plenty on a laptop, and it halves the Atlas
  # connections while developing.
  - target:
      kind: Deployment
      name: msme-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: msme-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  # Dev talks plain HTTP over the minikube ingress, so cookies must not be
  # marked Secure and the OAuth callback points at the local host.
  - target:
      kind: ConfigMap
      name: msme-config
    patch: |-
      - op: replace
        path: /data/NODE_ENV
        value: development
      - op: replace
        path: /data/CLIENT_URL
        value: http://msme.local
      - op: replace
        path: /data/GOOGLE_CALLBACK_URL
        value: http://msme.local/api/auth/google/callback

  # metrics-server on a fresh minikube can take a minute to report, and an HPA
  # with no metrics just logs errors. Kept, but it will not scale below 1.
  - target:
      kind: HorizontalPodAutoscaler
      name: msme-backend
    patch: |-
      - op: replace
        path: /spec/maxReplicas
        value: 3

  # A shared laptop cluster is usually carrying other namespaces, and the
  # scheduler compares REQUESTS against allocatable - so an over-generous
  # request leaves the pod Pending even on an idle node. The limit is
  # unchanged, so the service can still burst to 1Gi if the index grows.
  - target:
      kind: Deployment
      name: msme-recommender
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi

  # Roll by replacing, not by surging.
  #
  # The base uses maxUnavailable: 0 / maxSurge: 1, which is right for
  # production: the new pod is Ready before the old one goes. On a laptop
  # cluster that is already at ~99% of allocatable memory there is no room for
  # that extra pod, so the surge pod sits Pending, the old one never
  # terminates, and `rollout status` times out - the deploy looks broken when
  # the node is simply full. With one replica in dev the momentary gap costs
  # nothing, and the restart actually completes.
  - target:
      kind: Deployment
      name: msme-backend
    patch: |-
      - op: replace
        path: /spec/strategy/rollingUpdate
        value:
          maxUnavailable: 1
          maxSurge: 0
  - target:
      kind: Deployment
      name: msme-frontend
    patch: |-
      - op: replace
        path: /spec/strategy/rollingUpdate
        value:
          maxUnavailable: 1
          maxSurge: 0
  # The recommender has no strategy block in the base, so this adds one rather
  # than replacing it. Its default (25% of one replica, rounded down) is
  # maxUnavailable 0 - the same surge-first behaviour.
  - target:
      kind: Deployment
      name: msme-recommender
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0
