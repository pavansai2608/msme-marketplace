# TEMPLATE ONLY - this file is committed, so it must never hold real values.
#
# The live Secret is created straight from msme-backend/.env and is not
# committed:
#
#   kubectl -n msme create secret generic msme-secrets \
#     --from-env-file=msme-backend/.env
#
# Or copy this file, fill it in, and keep the copy out of git:
#
#   cp k8s/base/secret.example.yaml k8s/secret.yaml   # already gitignored
#   kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: msme-secrets
  labels:
    app.kubernetes.io/part-of: msme-marketplace
type: Opaque
stringData:
  # Required. Atlas SRV connection string; mongodb+srv:// already implies TLS.
  MONGO_URL: "mongodb+srv://REPLACE_ME:REPLACE_ME@cluster.example.mongodb.net/msme-marketplace"

  # Required. Signs the 15-minute access tokens.
  JWT_SECRET: "REPLACE_ME_WITH_A_LONG_RANDOM_STRING"

  # Optional. Falls back to "${JWT_SECRET}:refresh" when unset, which is safe
  # but means one leaked secret compromises both token families.
  JWT_REFRESH_SECRET: "REPLACE_ME_WITH_A_DIFFERENT_LONG_RANDOM_STRING"

  # Optional. Without all three, Google sign-in is disabled at boot and
  # /api/auth/google answers 503 instead of crashing.
  GOOGLE_CLIENT_ID: "REPLACE_ME.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "REPLACE_ME"

  # Optional. Password-reset mail is skipped when absent; /forgot-password
  # still returns its generic 200 so accounts cannot be enumerated.
  EMAIL_SERVICE: ""
  EMAIL_USER: ""
  EMAIL_PASS: ""
  FROM_NAME: ""
  FROM_EMAIL: ""

  # Optional. Shipping falls back to a flat fee when absent.
  SHIPROCKET_EMAIL: ""
  SHIPROCKET_PASSWORD: ""
