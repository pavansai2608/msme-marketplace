# Non-secret configuration only. Anything that would be damaging to read goes
# in the Secret instead - see secret.example.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: msme-config
  labels:
    app.kubernetes.io/part-of: msme-marketplace
data:
  NODE_ENV: "production"
  PORT: "5000"

  # In-cluster DNS. The backend reaches the recommender by service name; it
  # never leaves the cluster.
  RECOMMENDER_URL: "http://msme-recommender:8000"

  # Where the browser reaches the app. Used for CORS and for the post-OAuth
  # redirect, so it must match the ingress host exactly.
  CLIENT_URL: "http://msme.local"

  # Must also be registered verbatim as an authorised redirect URI in the
  # Google Cloud console, or the OAuth flow fails with redirect_uri_mismatch.
  GOOGLE_CALLBACK_URL: "http://msme.local/api/auth/google/callback"

  # Recommender blend weights. Content-based carries more because the
  # co-purchase matrix is sparse on a young catalogue.
  CONTENT_WEIGHT: "0.6"
  COLLAB_WEIGHT: "0.4"
