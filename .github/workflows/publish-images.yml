name: publish-images

# Builds the three service images and pushes them to ghcr.io.
#
# The EC2 box pulls from ghcr rather than building locally, because a t3.small
# has 2 GiB of RAM and `npm ci` for the frontend alone will not fit alongside a
# running cluster. Building here keeps the box for running things.

on:
  push:
    branches: [main]
    # Docs-only commits should not rebuild three images.
    paths-ignore:
      - '**.md'
      - 'aws/**'
      - 'k8s/**'
      - 'jenkins/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    strategy:
      # One broken image should not hide whether the other two built.
      fail-fast: false
      matrix:
        service: [msme-backend, msme-frontend, msme-recommender]

    steps:
      - uses: actions/checkout@v4

      # ghcr.io rejects an upper-case path. github.repository_owner preserves
      # whatever case the account was registered with, so it is normalised
      # rather than trusted.
      - name: Normalise the owner to lower case
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # The automatic token. No PAT to create, rotate or leak.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.value }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          # The EC2 box is amd64. Adding arm64 would roughly double the build
          # time for an image nothing pulls.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A single-platform build with provenance on still pushes an index
          # rather than a plain image manifest. k3s copes, but the plain
          # manifest is simpler to inspect with crictl on the box.
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Summary
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
